name: Docker Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  PUBLIC_ECR_REGISTRY: public.ecr.aws
  PUBLIC_ECR_IMAGE: ${{ vars.PUBLIC_ECR_IMAGE }}
  AWS_REGION: us-east-1

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            digest-name: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            digest-name: linux-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate public ECR config
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          test -n "${PUBLIC_ECR_IMAGE}" || { printf '%s\n' 'Set repository variable PUBLIC_ECR_IMAGE to public.ecr.aws/<alias>/<repository>.'; exit 1; }
          test -n "${AWS_ROLE_TO_ASSUME}" || { printf '%s\n' 'Set secret AWS_ROLE_TO_ASSUME to the GitHub OIDC role ARN.'; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to public ECR
        run: |
          aws ecr-public get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${PUBLIC_ECR_REGISTRY}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          tags: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.PUBLIC_ECR_IMAGE }}
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.digest-name }}
          cache-to: type=gha,scope=${{ matrix.digest-name }},mode=max

      - name: Smoke test image
        run: |
          docker run --rm "${GHCR_IMAGE}@${{ steps.build.outputs.digest }}" awsutils hello
          docker run --rm "${GHCR_IMAGE}@${{ steps.build.outputs.digest }}" aws hello

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.digest-name }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch image
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate public ECR config
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          test -n "${PUBLIC_ECR_IMAGE}" || { printf '%s\n' 'Set repository variable PUBLIC_ECR_IMAGE to public.ecr.aws/<alias>/<repository>.'; exit 1; }
          test -n "${AWS_ROLE_TO_ASSUME}" || { printf '%s\n' 'Set secret AWS_ROLE_TO_ASSUME to the GitHub OIDC role ARN.'; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to public ECR
        run: |
          aws ecr-public get-login-password --region "${AWS_REGION}" \
            | docker login --username AWS --password-stdin "${PUBLIC_ECR_REGISTRY}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.PUBLIC_ECR_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for image in "${GHCR_IMAGE}" "${PUBLIC_ECR_IMAGE}"; do
            tag_args=()
            while IFS= read -r tag; do
              if [[ "${tag}" == "${image}:"* ]]; then
                tag_args+=("-t" "${tag}")
              fi
            done <<< "$TAGS"

            image_args=()
            for digest in *; do
              image_args+=("${image}@sha256:${digest}")
            done

            docker buildx imagetools create "${tag_args[@]}" "${image_args[@]}"
          done

      - name: Inspect multi-arch manifest
        run: |
          docker buildx imagetools inspect "${GHCR_IMAGE}:sha-${GITHUB_SHA}"
          docker buildx imagetools inspect "${PUBLIC_ECR_IMAGE}:sha-${GITHUB_SHA}"
